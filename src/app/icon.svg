<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
  role="img"
  aria-label="POLNAREFF SYSTEM"
>
  <!--
    The app icon, as the file convention `src/app/icon.svg` — Next.js emits the
    <link rel="icon"> for it, which is what stops the browser asking for a
    /favicon.ico that does not exist and logging a 404 on every load.

    The mark is the composition, reduced to the one thing it is about: two arcs
    converging on a core. The ground is `ink` and the core is `cyan` from
    `WATERSHED_PALETTE`; `spectral` is the far end of the flow's own hue ramp.
    No new colours are introduced, and nothing here is drawn at a size where the
    palette's mid-tones would survive anyway.
  -->
  <defs>
    <linearGradient id="polnareff-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f6bff" />
      <stop offset="0.5" stop-color="#2f6d9e" />
      <stop offset="1" stop-color="#5fe4ff" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#04060c" />

  <g
    fill="none"
    stroke="url(#polnareff-flow)"
    stroke-width="2.4"
    stroke-linecap="round"
  >
    <path d="M5.5 9.5c5.4 0 5.4 6.5 10.5 6.5" />
    <path d="M26.5 9.5c-5.4 0-5.4 6.5-10.5 6.5" />
    <path d="M5.5 22.5c5.4 0 5.4-6.5 10.5-6.5" />
    <path d="M26.5 22.5c-5.4 0-5.4-6.5-10.5-6.5" />
  </g>

  <circle cx="16" cy="16" r="2.4" fill="#5fe4ff" />
</svg>
